<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
.card {
  width: 800px; height: 800px;
  position: relative; overflow: hidden;
  font-family: 'Source Sans 3', sans-serif; color: #fff;
  background: #1a0a2e;
}
.bg { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; object-position:center top; }
.overlay { position:absolute; top:0; left:0; width:100%; height:100%;
  background: linear-gradient(180deg, rgba(26,10,46,0.3) 0%, rgba(26,10,46,0.0) 20%, rgba(26,10,46,0.0) 35%, rgba(26,10,46,0.6) 55%, rgba(26,10,46,0.95) 70%, #1a0a2e 85%); }
.content {
  position:absolute; bottom:0; left:0; width:100%;
  text-align:center; padding: 0 40px 50px; z-index:1;
}
.name { font-family:'Playfair Display',serif; font-size:64px; font-weight:700; color:#FFD100; letter-spacing:3px; text-transform:uppercase; line-height:1.0; margin-bottom:12px; text-shadow:0 3px 20px rgba(0,0,0,0.5); }
.cargo { font-size:22px; font-weight:600; letter-spacing:4px; text-transform:uppercase; color:rgba(255,255,255,0.85); margin-bottom:4px; }
.partido { font-size:20px; font-weight:600; letter-spacing:6px; text-transform:uppercase; color:#D4A853; }
</style>
</head>
<body>
<div class="card">
  <img class="bg" src="file:///C:/Users/lucia/generated_images/foto_jeanine_flyer.jpg" alt="">
  <div class="overlay"></div>
  <div class="content">
    <div class="name">Jeanine<br>Domenech</div>
    <div class="cargo">Pré-candidata a Dep. Estadual</div>
    <div class="partido">Avante</div>
  </div>
</div>
</body></html>
